name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Import + CLI smoke (no network)
        run: |
          python -c "import snag, snag.cli, snag.api, snag.evidence, snag.mcp_server, snag.explore"
          snag version
          snag --help || true
          python -m snag version

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Vet
        run: go vet ./cmd/snag
      - name: Build
        run: go build -o /tmp/snag ./cmd/snag
      - name: Smoke
        run: /tmp/snag version
