name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Build libraries
        run: npm run build:libs
      - name: Typecheck, test and prose
        run: npm run check
      - name: Build dashboard
        run: npm run build -w @snag/dashboard

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the images and start the stack
        run: |
          docker compose up --build --wait --wait-timeout 180
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 2 http://127.0.0.1:8787/api/health
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 2 --output /dev/null http://127.0.0.1:3000/login

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
