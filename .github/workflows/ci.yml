name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Build libraries
        run: npm run build:libs
      - name: Typecheck, test and prose
        run: npm run check
      - name: Build dashboard
        run: npm run build -w @snag/dashboard

  cli:
    name: cli (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install
        run: pip install .
      - name: Vet
        run: go vet ./...
      - name: Test Python and Go parity
        run: python -m unittest discover -s tests -t .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the images and start the stack
        run: docker compose up --build --detach
      - name: Check the API, the database and the dashboard
        run: |
          curl --fail --silent --retry 20 --retry-connrefused --retry-all-errors --retry-delay 2 http://127.0.0.1:8787/api/health
          curl --fail --silent --header "authorization: Bearer dev-token-change-me" \
            --header "content-type: application/json" --data '{"name":"CI"}' http://127.0.0.1:8787/api/projects
          curl --fail --silent --header "authorization: Bearer dev-token-change-me" http://127.0.0.1:8787/api/projects
          curl --fail --silent --retry 20 --retry-connrefused --retry-all-errors --retry-delay 2 --output /dev/null http://127.0.0.1:3000/login
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 60

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
